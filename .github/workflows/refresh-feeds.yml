# Refreshes js/feeds.js from the creators in scripts/feeds.json every night, so channels pick up new uploads.
# Optional: add a YT_API_KEY repository secret (YouTube Data API v3) for more reliable lookups.
name: Refresh feeds
on:
  schedule:
    - cron: "30 21 * * *"   # 03:00 IST
  workflow_dispatch:         # "Run workflow" button in the Actions tab
permissions:
  contents: write
  pages: write
concurrency:
  group: site-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/fetch-feeds.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Check the new data before it ships
        run: node scripts/check.mjs   # a failure stops here: nothing is committed and the site keeps its last good data
      - name: Commit and redeploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet js/feeds.js; then echo "No new videos"; exit 0; fi
          sed -i -E "s#js/feeds\.js\?v=[^\"]*#js/feeds.js?v=$(date -u +%Y%m%d)#" index.html
          node scripts/build-pages.mjs   # channel pages copy the home page, so rebuild them after the stamp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Refresh feeds"
          git pull -q --rebase && git push -q
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
