# Checks which news and sports channels in scripts/live.json are live, every 30 minutes,
# and commits js/live.js only when that changes. Live channels on the site play these streams.
name: Refresh live streams
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: site-data
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-live.mjs
      - name: Commit and redeploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet js/live.js; then echo "No change"; exit 0; fi
          sed -i -E "s#js/live\.js\?v=[^\"]*#js/live.js?v=$(date -u +%Y%m%d%H%M)#" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Refresh live streams"
          git pull -q --rebase && git push -q
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
