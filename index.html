<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OGTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;700&family=VT323&display=swap">
<link rel="stylesheet" href="css/styles.css?v=12">
</head>
<body>
<button class="start" id="start" aria-label="Press to start OGTV with sound"><span class="start-logo">OGTV</span><span class="start-cta">Press to start</span><span class="start-sub">Tap anywhere or press any key · sound on</span></button>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>OGTV</h1><span>Always on, for the whole family</span></div>
    <div class="tools">
      <button class="retro-btn" id="retro" aria-pressed="false" title="Camcorder look (R)">Retro</button>
      <div class="clock" id="clock" aria-live="off">--:--<small>IST</small></div>
    </div>
  </header>

  <section class="main">
    <div class="tv">
      <div class="screen" id="screen">
        <div id="yt"></div>
        <div class="vhs" aria-hidden="true"><i class="grain"></i><span class="osd osd-play">PLAY &#9654;</span><span class="osd osd-time" id="osdTime"></span></div>
        <div class="static" id="static" aria-hidden="true"><canvas id="noise" width="400" height="225"></canvas><span class="ident" id="ident">OGTV</span></div>
        <div class="bug"><span class="live">LIVE</span><span class="chanbug" id="chanbug"></span></div>
        <div class="card" id="card" hidden></div>
        <button class="sound" id="sound" hidden>Turn sound on</button>
        <button class="fs" id="fs" aria-label="Full screen" title="Full screen (F)"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="now" aria-live="polite">
        <div class="now-row"><h3 id="nowTitle">Tuning in…</h3><span class="meta" id="nowTime"></span></div>
        <div class="bar"><i id="nowBar"></i></div>
        <div class="why" id="why"></div>
        <div class="next" id="next"></div>
      </div>
    </div>

    <nav class="remote" aria-label="Channels">
      <h4>Channels</h4>
      <div id="chlist"></div>
      <p class="hint">Remote keys: <kbd>↑</kbd> <kbd>↓</kbd> change channel, <kbd>1</kbd>–<kbd>30</kbd> jump (type two digits for 10+), <kbd>M</kbd> sound, <kbd>F</kbd> full screen, <kbd>R</kbd> retro</p>
    </nav>
  </section>

  <section class="guide" aria-label="Programme guide">
    <div class="guide-head"><h4>Programme guide</h4><span id="gspan">Next 3 hours · India Standard Time</span></div>
    <div class="gscroll"><div class="grid" id="grid"></div></div>
  </section>

  <p class="note" id="modeNote"></p>
</div>

<script src="js/catalog.js?v=12"></script>
<script src="js/feeds.js?v=12"></script>
<script src="js/live.js?v=12"></script>
<script src="js/festivals.js?v=12"></script>
<script src="js/channels.js?v=12"></script>
<script src="js/scheduler.js?v=12"></script>
<script src="js/app.js?v=12"></script>
</body>
</html>
